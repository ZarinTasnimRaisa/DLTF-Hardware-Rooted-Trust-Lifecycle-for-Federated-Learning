[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]

# PINNED. Do not "upgrade to latest": measured, solc 0.8.31 moves deploy gas by
# -49,167 (-2.36%) and shrinks bytecode by 227 bytes, invalidating the Chapter 5
# figure for no benefit. Runtime gas is stable within +/-0.11%.
solc_version = "0.8.24"

optimizer = true
optimizer_runs = 200

# REQUIRED. Without via-IR the contract fails to compile:
#   Error: Stack too deep ... at DLTFRegistry.sol:666 (_classifyCore)
via_ir = true

verbosity = 3

[lint]
# `forge lint` flags 9 downcasts in DLTFRegistry.sol as unsafe-typecast. All 9
# are safe, for two distinct reasons, both verified empirically:
#
# 1. The 7 casts in unpack() (lines 305-311). Truncation IS the operation:
#    unpack() is the exact inverse of pack(), which placed each field at those
#    bit offsets. Casting to uintN takes the low N bits -- precisely the field
#    being recovered. Verified: a device written with lastRound = 2^32-1
#    round-trips through pack/unpack with every field intact.
#
# 2. The 2 casts `d.lastRound = uint32(roundId)` (lines 442, 709). These DO
#    truncate above 2^32, but d.lastRound is telemetry: it is written and
#    re-serialised, never read for a security decision. The StaleRound guard
#    reads the CONTRACT-level `uint256 public lastRound` (line 135), which is
#    not truncated. Verified: after closing round 2^32+7 (device field shows 7),
#    replaying rounds 8 and 100 BOTH revert with StaleRound.
#
# Suppressing the rule keeps `forge build` output clean without touching the
# source. Comments alone would also work -- verified byte-identical executable
# core -- but a config exclusion documents the reasoning in one place.
exclude_lints = ["unsafe-typecast"]
